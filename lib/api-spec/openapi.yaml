openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sharing
    description: Public audio sharing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/shares/request-url:
    post:
      operationId: requestShareUploadUrl
      tags: [sharing]
      summary: Request a public audio upload URL
      description: Returns a short-lived upload URL for a processed WAV file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareUploadRequest"
      responses:
        "201":
          description: Upload URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareUploadResponse"
        "400":
          description: Invalid audio metadata
        "500":
          description: Unable to create upload URL
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ShareUploadRequest:
      type: object
      properties:
        name:
          type: string
        size:
          type: integer
          minimum: 1
          maximum: 52428800
        contentType:
          type: string
      required:
        - name
        - size
        - contentType
    ShareUploadResponse:
      type: object
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        expiresInSeconds:
          type: integer
      required:
        - uploadURL
        - objectPath
        - expiresInSeconds

